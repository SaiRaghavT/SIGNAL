[project]
name = "signal-mvp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "pillow>=11.0.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "reportlab>=5.0.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "pytesseract>=0.3.13",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
    "openai>=3.22.1",
]

[project.scripts]
signal-mvp = "signal_mvp:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
